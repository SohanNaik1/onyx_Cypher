<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KD's Garage Operations Desk - Mainframe Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Geist', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            surface: {
              DEFAULT: '#131318',
              dim: '#0e0e13',
              card: '#181820',
              input: '#121217',
              border: 'rgba(255, 255, 255, 0.08)',
              'border-glow': 'rgba(209, 123, 169, 0.35)',
            },
            primary: {
              DEFAULT: '#d17ba9',
              hover: '#e28fbc',
              dim: 'rgba(209, 123, 169, 0.15)',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0b0b0f;
      font-family: 'Geist', sans-serif;
    }
    .grid-pattern {
      background-image: radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 32px 32px;
    }
    .accent-glow {
      background: radial-gradient(circle at center, rgba(209, 123, 169, 0.12) 0%, rgba(37, 99, 235, 0.04) 45%, transparent 70%);
    }
    .glass-panel {
      background: rgba(22, 22, 29, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 40px -10px rgba(209, 123, 169, 0.08);
    }
    .input-field:focus {
      outline: none;
      border-color: rgba(209, 123, 169, 0.6);
      box-shadow: 0 0 15px -2px rgba(209, 123, 169, 0.25);
    }
  </style>
</head>
<body class="min-h-screen text-slate-200 flex flex-col justify-between relative overflow-hidden select-none">

  <!-- Ambient Radar & Depth Glow -->
  <div class="absolute inset-0 grid-pattern pointer-events-none opacity-40"></div>
  <div class="absolute inset-0 accent-glow pointer-events-none"></div>

  <!-- Subtle Tactical Crosshairs & Lat/Long Coordinates -->
  <div class="absolute top-6 left-8 flex items-center gap-3 text-xs font-mono text-zinc-600 tracking-wider">
    <div class="flex items-center gap-1.5 text-zinc-500">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-500/80 animate-ping"></span>
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 -ml-3"></span>
      <span class="font-semibold text-zinc-400">GATEWAY: AP-SOUTH-1A</span>
    </div>
    <span class="text-zinc-700">/</span>
    <span>LAT: 15.8497° N</span>
    <span class="text-zinc-700">/</span>
    <span>LON: 74.4977° E</span>
  </div>

  <div class="absolute top-6 right-8 flex items-center gap-2 text-xs font-mono text-zinc-500">
    <span class="px-2 py-0.5 rounded bg-zinc-900 border border-zinc-800 text-zinc-400">TLS 1.3</span>
    <span class="px-2 py-0.5 rounded bg-zinc-900 border border-zinc-800 text-zinc-400">ECDSA-P384</span>
  </div>

  <!-- Center Main Login Card -->
  <main class="flex-1 flex items-center justify-center p-6 relative z-10">
    <div class="w-full max-w-[430px] glass-panel rounded-2xl p-8 sm:p-9 relative">
      
      <!-- Top Subtle Corner Accent Line -->
      <div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-[1px] bg-gradient-to-r from-transparent via-[#d17ba9]/60 to-transparent"></div>

      <!-- Mainframe Header -->
      <div class="flex flex-col items-center text-center mb-8">
        <!-- Shield / Operations Icon -->
        <div class="w-14 h-14 rounded-2xl bg-[#231b26] border border-[#d17ba9]/30 flex items-center justify-center mb-4 shadow-[0_0_24px_rgba(209,123,169,0.2)]">
          <i data-lucide="shield-check" class="w-7 h-7 text-[#d17ba9]"></i>
        </div>
        
        <h1 class="text-2xl font-bold tracking-tight text-white mb-1.5">
          KD's Garage
        </h1>
        <p class="text-xs font-medium text-zinc-400 tracking-wide">
          Autonomous Operations Desk
        </p>
      </div>

      <!-- Authentication Form -->
      <form class="space-y-5" onsubmit="event.preventDefault(); window.location.href='/code.html';">
        
        <!-- Email Input -->
        <div class="space-y-1.5">
          <label class="block text-xs font-medium text-zinc-300 tracking-wide">
            Work Email
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-zinc-500">
              <i data-lucide="mail" class="w-4 h-4"></i>
            </div>
            <input 
              type="email" 
              value="ramesh@kdgarage.in" 
              class="input-field w-full pl-10 pr-4 py-2.5 rounded-xl bg-[#121217] border border-white/10 text-sm text-zinc-200 placeholder-zinc-600 font-mono transition-all duration-200"
              placeholder="operator@kdgarage.in"
              required
            />
          </div>
        </div>

        <!-- Password Input -->
        <div class="space-y-1.5">
          <div class="flex items-center justify-between">
            <label class="block text-xs font-medium text-zinc-300 tracking-wide">
              Password
            </label>
            <a href="#" class="text-xs font-medium text-[#d17ba9] hover:text-[#e28fbc] transition-colors duration-150">
              Forgot credentials?
            </a>
          </div>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-zinc-500">
              <i data-lucide="lock" class="w-4 h-4"></i>
            </div>
            <input 
              type="password" 
              value="••••••••••••••••" 
              class="input-field w-full pl-10 pr-10 py-2.5 rounded-xl bg-[#121217] border border-white/10 text-sm text-zinc-200 placeholder-zinc-600 font-mono tracking-widest transition-all duration-200"
              placeholder="Password"
              required
            />
            <button type="button" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-zinc-500 hover:text-zinc-300 transition-colors">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <!-- Remember / Fast Node Checkbox -->
        <div class="flex items-center justify-between pt-0.5 pb-1">
          <label class="flex items-center gap-2 cursor-pointer text-xs text-zinc-400">
            <input type="checkbox" checked class="rounded bg-zinc-900 border-zinc-700 text-[#d17ba9] focus:ring-0 focus:ring-offset-0 w-3.5 h-3.5 accent-[#d17ba9]" />
            <span>Persist session token on this terminal</span>
          </label>
        </div>

        <!-- Main Action CTA -->
        <div class="pt-1">
          <button 
            type="submit" 
            class="w-full py-3 px-4 rounded-xl font-medium text-sm text-white bg-gradient-to-r from-[#d17ba9] to-[#bf6495] hover:from-[#db8cb6] hover:to-[#ce73a4] transition-all duration-200 shadow-[0_4px_20px_rgba(209,123,169,0.35)] hover:shadow-[0_4px_24px_rgba(209,123,169,0.5)] active:scale-[0.99] flex items-center justify-center gap-2 group cursor-pointer"
          >
            <span>Secure Access</span>
            <i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-0.5 transition-transform duration-150"></i>
          </button>
        </div>
      </form>

      <!-- Tactical Divider -->
      <div class="relative my-6">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-white/5"></div>
        </div>
        <div class="relative flex justify-center text-[10px] uppercase font-mono tracking-wider">
          <span class="bg-[#181820] px-3 text-zinc-500">Security Clearance Level 4</span>
        </div>
      </div>

      <!-- Hardware Key / Passkey Alt -->
      <button type="button" class="w-full py-2.5 px-3 rounded-xl border border-white/5 bg-white/[0.02] hover:bg-white/[0.05] text-xs font-medium text-zinc-300 transition-all flex items-center justify-center gap-2 mb-6 cursor-pointer">
        <i data-lucide="key-round" class="w-3.5 h-3.5 text-zinc-400"></i>
        <span>Authenticate with Hardware Security Key</span>
      </button>

      <!-- System Status Flex Item -->
      <div class="pt-4 border-t border-white/5 flex items-center justify-center gap-2 text-xs font-mono text-zinc-400">
        <span class="relative flex h-2 w-2">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
        </span>
        <span class="text-zinc-400">System v2.4 Online &amp; Encrypted</span>
      </div>

    </div>
  </main>

  <!-- Absolute Footer -->
  <footer class="py-6 px-4 text-center relative z-10 border-t border-white/[0.03]">
    <p class="text-[11px] font-mono text-zinc-500 tracking-wider">
      Authorized Personnel Only. Monitored by KD Intelligence.
    </p>
  </footer>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
